<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Name Writing Practice</title>
    <link rel="stylesheet" href="index.html" />
    <!-- Load external libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --primary-color: #4a6fa5;
            --primary-light: #eef2f7;
            --secondary-color: #e74c3c;
            --text-color: #333;
            --light-gray: #f5f5f5;
            --gray: #ddd;
            --dark-gray: #666;
            --success-color: #2ecc71;
            --radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #f9f9f9;
            padding: 0;
            margin: 0;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--gray);
            color: var(--primary-color);
        }
        
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 2.4rem;
            margin-bottom: 5px;
        }
        
        .app-description {
            font-size: 1.1rem;
            color: var(--dark-gray);
        }

        /* Tab styles */
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gray);
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark-gray);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: var(--transition);
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
        
        .section {
            background-color: white;
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--gray);
            border-radius: var(--radius);
            font-size: 16px;
            transition: var(--transition);
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        .file-upload-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px dashed var(--gray);
            border-radius: var(--radius);
            background-color: var(--light-gray);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            justify-content: center;
        }
        
        .file-upload-label:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }
        
        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .download-options {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .download-button {
            background-color: var(--primary-light);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 12px 20px;
            font-size: 14px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-button:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        button {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .status-message {
            padding: 12px 15px;
            border-radius: var(--radius);
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        
        .status-success {
            background-color: rgba(46, 204, 113, 0.15);
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }
        
        .status-error {
            background-color: rgba(231, 76, 60, 0.15);
            color: #c0392b;
            border-left: 4px solid #c0392b;
        }
        
        .hidden {
            display: none !important;
        }

        .student-form {
            border: 1px solid var(--gray);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .student-header h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .remove-student {
            background: none;
            border: none;
            color: var(--secondary-color);
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
            line-height: 1;
            opacity: 0.7;
            transition: var(--transition);
        }

        .remove-student:hover {
            opacity: 1;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .secondary-button {
            background-color: var(--primary-light);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .secondary-button:hover {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Name Writing Practice</h1>
            <p class="app-description">Generate personalized name writing worksheets from student data</p>
        </header>

        <div class="download-options">
            <button class="download-button" id="downloadTemplate">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                Download Excel Template
            </button>
            <button class="download-button" id="downloadOffline">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download Offline App
            </button>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="manual">Manual Entry</div>
            <div class="tab" data-tab="excel">Excel Upload</div>
        </div>

        <div class="tab-content active" id="manual-tab">
            <div class="section">
                <div id="studentForms">
                    <!-- Student form template -->
                    <div class="student-form">
                        <div class="student-header">
                            <h3>Student 1</h3>
                            <button type="button" class="remove-student" title="Remove student">×</button>
                        </div>
                        <div class="input-group">
                            <label for="yearNumber_0">Year Number:</label>
                            <input type="number" id="yearNumber_0" class="yearNumber" min="1" required>
                        </div>
                        <div class="input-group">
                            <label for="classNumber_0">Class Number:</label>
                            <input type="number" id="classNumber_0" class="classNumber" min="1" required>
                        </div>
                        <div class="input-group">
                            <label for="studentNumber_0">Student Number:</label>
                            <input type="number" id="studentNumber_0" class="studentNumber" min="1" required>
                        </div>
                        <div class="input-group">
                            <label for="firstName_0">First Name:</label>
                            <input type="text" id="firstName_0" class="firstName" required>
                        </div>
                        <div class="input-group">
                            <label for="lastName_0">Last Name:</label>
                            <input type="text" id="lastName_0" class="lastName" required>
                        </div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="addStudent" class="secondary-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                        Add Another Student
                    </button>
                    <button id="generateManual">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Generate Worksheets
                    </button>
                </div>
            </div>
        </div>

        <div class="tab-content" id="excel-tab">
            <div class="section">
                <div class="file-upload">
                    <label for="excelFile" class="file-upload-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 18v-6"></path><path d="M8 15l4-3 4 3"></path></svg>
                        <span>Choose Excel File (.xlsx) or Drag & Drop</span>
                    </label>
                    <input type="file" id="excelFile" accept=".xlsx">
                </div>
                <div id="selectedFile" class="selected-file"></div>
                <div id="statusMessage" class="hidden"></div>
                <button id="generateAll">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Generate Worksheets
                </button>
            </div>
        </div>
    </div>

    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize variables
            let customFont = null;
            let writingFont = null;
            let studentCounter = 1;

            // Load fonts when the page loads
            async function loadFonts() {
                try {
                    const fontResponse = await fetch('font.otf');
                    const writingFontResponse = await fetch('writingfont.otf');
                    
                    const fontBuffer = await fontResponse.arrayBuffer();
                    const writingFontBuffer = await writingFontResponse.arrayBuffer();

                    customFont = fontBuffer;
                    writingFont = writingFontBuffer;
                } catch (error) {
                    console.error('Error loading fonts:', error);
                }
            }

            // Load fonts
            loadFonts();

            // Tab switching functionality
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                });
            });

            // Function to create a new student form
            function createStudentForm(index) {
                const div = document.createElement('div');
                div.className = 'student-form';
                div.innerHTML = `
                    <div class="student-header">
                        <h3>Student ${index}</h3>
                        ${index > 1 ? '<button type="button" class="remove-student" title="Remove student">×</button>' : ''}
                    </div>
                    <div class="input-group">
                        <label for="yearNumber_${index-1}">Year Number:</label>
                        <input type="number" id="yearNumber_${index-1}" class="yearNumber" min="1" required>
                    </div>
                    <div class="input-group">
                        <label for="classNumber_${index-1}">Class Number:</label>
                        <input type="number" id="classNumber_${index-1}" class="classNumber" min="1" required>
                    </div>
                    <div class="input-group">
                        <label for="studentNumber_${index-1}">Student Number:</label>
                        <input type="number" id="studentNumber_${index-1}" class="studentNumber" min="1" required>
                    </div>
                    <div class="input-group">
                        <label for="firstName_${index-1}">First Name:</label>
                        <input type="text" id="firstName_${index-1}" class="firstName" required>
                    </div>
                    <div class="input-group">
                        <label for="lastName_${index-1}">Last Name:</label>
                        <input type="text" id="lastName_${index-1}" class="lastName" required>
                    </div>
                `;

                if (index > 1) {
                    div.querySelector('.remove-student').addEventListener('click', () => {
                        div.remove();
                        updateStudentNumbers();
                    });
                }

                return div;
            }

            // Function to update student numbers after removal
            function updateStudentNumbers() {
                document.querySelectorAll('.student-form').forEach((form, index) => {
                    form.querySelector('h3').textContent = `Student ${index + 1}`;
                });
            }

            // Add student button handler
            document.getElementById('addStudent').addEventListener('click', () => {
                studentCounter++;
                const newForm = createStudentForm(studentCounter);
                document.getElementById('studentForms').appendChild(newForm);
            });

            // Manual generation handler
            document.getElementById('generateManual').addEventListener('click', async () => {
                const students = [];
                const forms = document.querySelectorAll('.student-form');

                // Collect data from all forms
                forms.forEach(form => {
                    const student = {
                        yearNumber: form.querySelector('.yearNumber').value,
                        classNumber: form.querySelector('.classNumber').value,
                        studentNumber: form.querySelector('.studentNumber').value,
                        firstName: form.querySelector('.firstName').value,
                        lastName: form.querySelector('.lastName').value
                    };

                    if (student.yearNumber && student.classNumber && student.studentNumber && 
                        student.firstName && student.lastName) {
                        students.push(student);
                    }
                });

                if (students.length === 0) {
                    alert('Please fill in all fields for at least one student');
                    return;
                }

                try {
                    const pdfDoc = await PDFLib.PDFDocument.create();
                    pdfDoc.registerFontkit(fontkit);
                    const regularFont = await pdfDoc.embedFont(customFont);
                    const practiceFont = await pdfDoc.embedFont(writingFont);

                    // Generate worksheets for all students
                    for (let i = 0; i < students.length; i += 2) {
                        // Front page
                        const frontPage = pdfDoc.addPage([842, 595]); // A4 landscape
                        await generateStudentPageHalf(frontPage, students[i], regularFont, practiceFont, 'left');
                        
                        if (i + 1 < students.length) {
                            await generateStudentPageHalf(frontPage, students[i + 1], regularFont, practiceFont, 'right');
                        }
                        
                        // Back page
                        const backPage = pdfDoc.addPage([842, 595]); // A4 landscape
                        await generateStudentPageHalf(backPage, students[i], regularFont, practiceFont, 'right');
                        
                        if (i + 1 < students.length) {
                            await generateStudentPageHalf(backPage, students[i + 1], regularFont, practiceFont, 'left');
                        }
                    }

                    // Save and download
                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'student_worksheets.pdf';
                    link.click();
                } catch (error) {
                    console.error('Error generating PDF:', error);
                    alert('Error generating worksheets. Please try again.');
                }
            });

            // Excel file handling
            const excelFileInput = document.getElementById('excelFile');
            const selectedFileDisplay = document.getElementById('selectedFile');
            const statusMessage = document.getElementById('statusMessage');
            const columnMapping = document.getElementById('columnMapping');
            const yearGroupSelect = document.getElementById('yearGroupColumn');
            const classSelect = document.getElementById('classColumn');
            const studentNumberSelect = document.getElementById('studentNumberColumn');
            const firstNameSelect = document.getElementById('firstNameColumn');
            const lastNameSelect = document.getElementById('lastNameColumn');
            const practiceLinesInput = document.getElementById('practiceLines');
            const generateAllButton = document.getElementById('generateAllButton');
            const previewButton = document.getElementById('previewButton');
            const previewContainer = document.getElementById('previewContainer');
            const previewContent = document.getElementById('previewContent');
            const studentInfo = document.getElementById('studentInfo');

            let studentData = [];
            let validExcelFile = false;

            excelFileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) {
                    selectedFileDisplay.textContent = '';
                    statusMessage.innerHTML = '';
                    statusMessage.classList.add('hidden');
                    columnMapping.classList.add('hidden');
                    validExcelFile = false;
                    return;
                }

                selectedFileDisplay.textContent = `Selected file: ${file.name}`;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        studentData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        if (studentData.length > 0) {
                            const headers = studentData[0];
                            populateColumnSelects(headers);
                            
                            // Auto-detect column mappings
                            const expectedColumns = {
                                "Year Number": 0, // Column A
                                "Class Number": 1, // Column B
                                "Student Number": 2, // Column C
                                "First Name": 3, // Column D
                                "Last Name": 4  // Column E
                            };
                            
                            // Validate Excel structure
                            let missingColumns = [];
                            for (const [columnName, expectedIndex] of Object.entries(expectedColumns)) {
                                const headerIndex = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === columnName.toLowerCase());
                                
                                if (headerIndex === -1) {
                                    missingColumns.push(columnName);
                                }
                            }
                            
                            if (missingColumns.length > 0) {
                                // Show error and required column mapping
                                statusMessage.innerHTML = `
                                    <div class="status-message status-error">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                        Excel file is missing required columns: ${missingColumns.join(', ')}.<br>
                                        Please select the correct columns below.
                                    </div>`;
                                statusMessage.classList.remove('hidden');
                                columnMapping.classList.remove('hidden');
                                validExcelFile = false;
                            } else {
                                // Valid Excel file - hide column mapping
                                statusMessage.innerHTML = `
                                    <div class="status-message status-success">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                        Excel file validated successfully. Found ${studentData.length - 1} students.
                                    </div>`;
                                statusMessage.classList.remove('hidden');
                                columnMapping.classList.add('hidden');
                                validExcelFile = true;
                                
                                // Set default column mappings automatically
                                yearGroupSelect.value = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === "year number".toLowerCase());
                                classSelect.value = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === "class number".toLowerCase());
                                studentNumberSelect.value = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === "student number".toLowerCase());
                                firstNameSelect.value = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === "first name".toLowerCase());
                                lastNameSelect.value = headers.findIndex(h => 
                                    h && h.toString().toLowerCase() === "last name".toLowerCase());
                            }
                        } else {
                            statusMessage.innerHTML = `
                                <div class="status-message status-error">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                    Excel file appears to be empty.
                                </div>`;
                            statusMessage.classList.remove('hidden');
                            columnMapping.classList.add('hidden');
                            excelFileInput.value = '';
                            selectedFileDisplay.textContent = '';
                            validExcelFile = false;
                        }
                    } catch (error) {
                        console.error('Error parsing Excel file:', error);
                        statusMessage.innerHTML = `
                            <div class="status-message status-error">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                                Error parsing Excel file. Please check the format.
                            </div>`;
                        statusMessage.classList.remove('hidden');
                        columnMapping.classList.add('hidden');
                        excelFileInput.value = '';
                        selectedFileDisplay.textContent = '';
                        validExcelFile = false;
                    }
                };
                reader.readAsArrayBuffer(file);
            });

            function populateColumnSelects(headers) {
                const selects = [yearGroupSelect, classSelect, studentNumberSelect, 
                               firstNameSelect, lastNameSelect];
                
                selects.forEach(select => {
                    select.innerHTML = '<option value="">Select Column</option>';
                    headers.forEach((header, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        option.textContent = header || `Column ${index + 1}`;
                        select.appendChild(option);
                    });
                });
            }

            // Preview generation
            previewButton.addEventListener('click', () => {
                if (!validExcelFile && studentData.length < 2) {
                    statusMessage.innerHTML = `
                        <div class="status-message status-error">

                try {
                    const fontResponse = await fetch('font.otf');
                    const writingFontResponse = await fetch('writingfont.otf');
                    
                    const fontBlob = await fontResponse.blob();
                    const writingFontBlob = await writingFontResponse.blob();
                    
                    zip.file('font.otf', fontBlob);
                    zip.file('writingfont.otf', writingFontBlob);
                    
                    // Generate the zip file
                    const content = await zip.generateAsync({type: 'blob'});
                    
                    // Create download link
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = 'worksheet_generator.zip';
                    link.click();
                } catch (error) {
                    console.error('Error creating offline package:', error);
                    alert('Error creating offline package. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
